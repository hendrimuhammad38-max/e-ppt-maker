<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1B2A41">
  <title>E-PPT Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Layar kunci akses -->
  <div id="lock" class="lock" hidden>
    <form class="lock-card" id="lockForm" autocomplete="off">
      <div class="brand-mark lg">E</div>
      <h1>E-PPT Maker</h1>
      <p class="muted">Masukkan Kunci Akses dari log <code>setupAppEnvironment()</code> di Apps Script.</p>
      <label class="field">
        <span class="label">Kunci Akses <i class="req">*</i></span>
        <input type="password" id="lockKey" class="input" placeholder="Tempel kunci di sini" required>
        <small class="field-error" id="lockError"></small>
      </label>
      <button class="btn btn-primary btn-block" type="submit" id="lockBtn">Masuk</button>
    </form>
  </div>

  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">E</div>
        <div><b>E-PPT</b> Maker</div>
      </div>
      <div class="sidebar-label">WORKSPACE</div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="sidebar-foot">
        <div class="avatar" id="sideAvatar"></div>
        <div class="sidebar-user">
          <b>Pemilik</b>
          <small>Akun Pribadi</small>
        </div>
        <button class="icon-btn ghost-dark" id="logoutBtn" title="Keluar dari perangkat ini"></button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- Area utama -->
    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-right">
          <span class="pill pill-quota" id="quotaPill"></span>
          <span class="sync" id="syncState"></span>
          <a class="btn btn-primary btn-sm hide-sm" href="#/baru" id="topCreate"></a>
        </div>
      </header>
      <div class="demo-banner" id="demoBanner" hidden></div>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <!-- Navigasi bawah (ponsel) -->
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
